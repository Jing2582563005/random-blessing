<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>送你一句祝福</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 24px;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #fff7c8 0, transparent 28%),
        radial-gradient(circle at 80% 80%, #ffcadd 0, transparent 30%),
        linear-gradient(135deg, #fff4df, #ffdce8);
    }

    .decoration {
      position: fixed;
      color: rgba(255, 255, 255, 0.85);
      font-size: 30px;
      animation: float 4s ease-in-out infinite;
    }

    .d1 {
      top: 10%;
      left: 10%;
    }

    .d2 {
      top: 18%;
      right: 12%;
      animation-delay: 1s;
    }

    .d3 {
      bottom: 12%;
      left: 15%;
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(8deg);
      }
    }

    .top-picture {
      position: relative;
      z-index: 1;
      width: clamp(110px, 28vw, 150px);
      aspect-ratio: 1;
      object-fit: cover;
      border: 5px solid rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      box-shadow: 0 12px 30px rgba(177, 91, 119, 0.2);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 520px;
      padding: 42px 28px 34px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(177, 91, 119, 0.18);
      backdrop-filter: blur(10px);
    }

    .icon {
      font-size: 46px;
      animation: shine 1.5s ease-in-out infinite alternate;
    }

    @keyframes shine {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.12);
      }
    }

    h1 {
      margin: 14px 0 8px;
      color: #d65d7a;
      font-size: 26px;
    }

    .tip {
      margin: 0;
      color: #a47a84;
      font-size: 14px;
    }

    #blessing {
      min-height: 110px;
      margin: 28px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #4f3e43;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.8;
      transition: opacity 0.25s, transform 0.25s;
    }

    .footer {
      margin-top: 20px;
      color: #ba969f;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="decoration d1">✦</div>
  <div class="decoration d2">♡</div>
  <div class="decoration d3">✿</div>

  <img class="top-picture" src="picture.jpg" alt="教师节祝福图片">

  <main class="card">
    <div class="icon">🎁</div>

    <h1>送你一句祝福</h1>

    <p class="tip">你与这句祝福的相遇并非偶然</p>

    <div id="blessing"></div>

    <div class="footer">愿这份小小的幸运陪伴你</div>
  </main>

  <script>
    const blessings = [
      "愿今天的下班路是“绿灯波”，改作业的手是“无影手”，而你的心是“如来佛”——学生怎么闹，都稳如泰山！教师节快乐！",
      "教师节许个愿：从此“拖堂”变“抢座”，学生追着问问题，而你挥挥手说：“下课了，快走快走，我要休息！”哈哈！教师节快乐！",
      "今天给自己的KPI只有一项：嘴角上扬45度，保持一整天。教师节快乐！",
      "这一天，请忘记“人类灵魂工程师”这个职称，做回那个追剧、撸串、爱睡懒觉的快乐小神仙！教师节快乐！",
      "今天必须对自己温柔一点。教师节快乐！",
      "如果今天有学生惹你生气，请默念：“我选的、我选的……不对，是缘分选的！”哈哈！教师节快乐！",
      "祝你的心情像刚批完所有作业的那一刻——风平浪静，海阔天空，世界和平！哈哈！教师节快乐！",
      "愿你今天收到的祝福，比班里最调皮的学生一年说的话还多。教师节快乐！",
      "保护嗓子，多喝热水；保护心情，永葆少女心。教师节快乐！",
      "教师节最动听的三个字，不是“我爱你”，而是“没作业”——但今天，请给自己布置一份“快乐作业”——爱老己。教师节快乐！",
      "讲台上你是王者，讲台下请做回青铜——该躺平躺平，该歇着歇着，别硬撑！教师节快乐！",
      "今天你可以是任何人：可以是“孩子王”，可以是“段子手”，但最主要的是——你是你自己。狠狠爱自己！教师节快乐！",
      "愿你的辛苦都变成学生的出息，愿你的付出都变成工资的厚度。教师节快乐！",
      "别人关心你教得好不好，我只关心你睡得饱不饱。节日快乐，天大地大，睡觉最大！今天早睡觉，明天气色好。教师节快乐！",
      "祝所有“扛得住检查、做得出课件、谈得了家长”的超人们，今天做回凡人，尽情偷懒。教师节快乐呀！",
      "除了想着“桃李满天下”，也要想想“火锅满肚子”、“花开满阳台”、“快乐满心房”。教师节快乐！",
      "你讲过的那些大道理，学生可能都忘了；但你笑起来的那个瞬间，他们能记一辈子。今天，多笑笑。教师节快乐！",
      "你笑起来真好看！教师节快乐！",
      "这世界有那么多人，多幸运，实验有您！教师节快乐！",
      "讲台三尺，粉笔一寸，您用最朴素的方式，把世界一点点推近学生眼前。辛苦了，节日快乐！",
      "所有的光都需要一个起点，而您，就是那个在黑板上点亮星星的人。教师节快乐！",
      "学生记住的，往往不是哪道题的解法，而是您某次弯下腰说话的语气。那里面有温度，有尊重，有爱。教师节快乐！",
      "教育是一场漫长的守望。您种下的种子，有些很快开花，有些需要很多年。但每一颗，您都用心浇灌过。教师节快乐！",
      "每个清晨，您走进教室的那一刻，都在参与无数个生命的成长。这件事本身，就很了不起。教师节快乐！",
      "这世界有很多种英雄，而您是那种不动声色的——在小小的教室里，撑起大大的天空。教师节快乐！",
      "学生一天天长大，而你一天天变老。可那些从你手里飞出去的翅膀，一辈子都记得起飞时的那阵风。教师节快乐！",
      "教师节最该被看见的，不是掌声和鲜花，而是那些被悄悄咽下去的疲惫，和永远放不下的牵挂。教师节快乐！",
      "您把最好的年华，铺在了一间教室里。那些被粉笔灰染白的日子，后来都变成了学生回忆里的光。教师节快乐！",
      "教育的意义，从来不写在成绩单上。它写在孩子们多年后回望时的眼睛里——而那里，有您的倒影。教师节快乐！",
      "做一个老师，就是选择了一种安静的燃烧。不一定轰轰烈烈，但足够温暖身边的人。教师节快乐！",
      "您教过的每一个字、每一道题、每一句话，都可能在某个学生的生命里，悄悄长成一片森林。教师节快乐！",
      "老师的辛苦，常常是看不见的。看不见的备课、看不见的焦虑、看不见的牵挂。但今天，请看见您自己。教师节快乐！",
      "没有人天生会做老师。你也是一边学着，一边爱着；一边疲惫着，一边坚持着。正因为如此，才动人。教师节快乐！",
      "学生是您的过客，您是学生的驿站。可有些驿站，住进心里就是一辈子。教师节快乐！",
      "愿您被这个世界温柔以待，不为“蜡烛”，不为“春蚕”，只为你是一个值得被好好对待的人。教师节快乐！",
      "所有的大人，都曾经是孩子。而您，是那个守护孩子长大的人。这份守护，值得被郑重地感谢。教师节快乐！",
      "您不需要是“最美教师”，您已经是某个人心里最温暖的老师。节日快乐，好好爱自己。教师节快乐！"
    ];

    const randomIndex = Math.floor(Math.random() * blessings.length);
    document.getElementById("blessing").textContent = blessings[randomIndex];
  </script>
</body>
</html>
